name: Hydrate enhanced app

on:
  push:
    paths:
      - 'app-v2.js.gz.b64'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode enhanced app
        run: |
          base64 --decode app-v2.js.gz.b64 | gunzip > app.js
          node --check app.js
      - name: Commit app.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No app.js changes"
            exit 0
          fi
          git commit -m "Enhance CSS parser and radial gradient support"
          git push
